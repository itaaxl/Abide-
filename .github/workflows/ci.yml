name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Row-level security tests (two users, real PostgreSQL)
        run: npm run test:db
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm run build
      - name: End-to-end smoke (guest flows, axe, CSP, responsive)
        run: |
          npx playwright install --with-deps chromium
          npm start &
          npx --yes wait-on http://localhost:3000/api/health
          npm run test:e2e

  accounts-e2e:
    # Signed-in flows against a local Supabase stack (Postgres, Auth, Mailpit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start -x edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta,studio,realtime,storage-api
      - name: Configure app for local Supabase
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } > .env.local
      - run: npm run build
      - run: |
          npx playwright install --with-deps chromium
          npm start &
          npx --yes wait-on http://localhost:3000/api/health
          npm run test:e2e:accounts
